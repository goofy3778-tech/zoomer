name: Build Binary
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - run: shards build --production --static
      - uses: actions/upload-artifact@v4
        with:
          name: zoomer-executable
          path: bin/zoomer
